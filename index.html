/* Layout: KAI control rail on the left, the artwork stage on the right; stacks on phones. */
:root{
  color-scheme:light;
  --off:#E5E5E5; --paper:#EEEDEC; --ink:#000000; --char:#333333; --mut:#4C4C4C; --line:rgba(0,0,0,.14);
  --deploy:#9D4EF1; --studio:#E44DE9; --labs:#FF4E4E; --ventures:#FFA749; --institute:#008EEB; --academy:#00ED6B;
  --tg:"PP Telegraf",Arial,sans-serif; --ar:"Archivo",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--off);color:var(--ink);font-family:var(--ar);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:380px minmax(0,1fr);min-height:100vh}
/* rail */
.rail{border-right:1px solid var(--line);padding-block:28px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:24px;display:flex;flex-direction:column;gap:30px;max-height:100vh;overflow:auto}
.brand{display:flex;align-items:center;justify-content:space-between}
.brand img{height:28px}
.brand span{font:500 11px/1 var(--ar);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
h1{margin:0;font:400 44px/.92 var(--tg);letter-spacing:-.035em;text-transform:uppercase}
h1 span{font-weight:200}
.sec{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.sec h2{margin:0;font:500 11px/1 var(--ar);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between}
.sec h2 em{font-style:normal;letter-spacing:0;text-transform:none;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chip,.btn{all:unset;cursor:pointer;font:400 13px/1 var(--ar);padding:10px 12px;border:1px solid var(--line);background:transparent;color:var(--ink);display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s}
.seg button:hover,.chip:hover,.btn:hover{border-color:rgba(0,0,0,.45)}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--ink);color:var(--off);border-color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px}
.seg button{justify-content:center;text-align:center}
.swatches{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.sw{all:unset;cursor:pointer;aspect-ratio:1;border-radius:50%;position:relative;outline:1px solid var(--line);outline-offset:2px}
.sw[aria-pressed="true"]{outline:2px solid var(--ink)}
.sw[aria-pressed="true"]::after{content:attr(data-order);position:absolute;inset:0;display:grid;place-items:center;font:500 11px/1 var(--ar);color:#000}
.sw.white{background:#F6F1EF}
.sw.white[aria-pressed="true"]::after{content:"✓"}
.hint{margin:0;font:400 12.5px/1.45 var(--ar);color:var(--mut)}
label.f{display:flex;flex-direction:column;gap:6px;font:500 11px/1 var(--ar);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
input[type=text],input[type=number],select{font:400 14px/1.2 var(--ar);color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:10px 12px;border-radius:0;letter-spacing:0;text-transform:none;width:100%}
input[type=range]{width:100%;accent-color:#000}
.tog{display:flex;align-items:center;justify-content:space-between;font:400 14px/1.2 var(--ar)}
.tog input{width:18px;height:18px;accent-color:#000}
.cta{all:unset;cursor:pointer;flex:1;text-align:center;padding:14px;font:400 14px/1 var(--ar);background:var(--ink);color:var(--off);display:inline-flex;justify-content:center;align-items:center;gap:10px}
.cta.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.cta:disabled{opacity:.4;cursor:wait}
.tri{width:0;height:0;border-left:7px solid currentColor;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.seg.styles button:last-child:nth-child(odd){grid-column:1/-1}
.mrow.off{opacity:.38}
.dirrow{display:flex;align-items:center;gap:18px}
.dial{position:relative;flex:none;width:84px;height:84px;border-radius:50%;cursor:grab;touch-action:none;
  background:repeating-conic-gradient(from -1deg,var(--ink) 0 2deg,transparent 2deg 90deg),repeating-conic-gradient(from -.5deg,rgba(0,0,0,.28) 0 1deg,transparent 1deg 15deg);
  box-shadow:inset 0 0 0 1px var(--ink)}
.dial::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--off)}
.dial::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--ink)}
.dial:active{cursor:grabbing}
.dial:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.needle{position:absolute;left:calc(50% - 1px);bottom:50%;width:2px;height:calc(50% - 10px);background:var(--ink);transform-origin:50% 100%;z-index:1}
.needle::after{content:"";position:absolute;left:50%;top:-4px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--ink)}
.dir-r{display:flex;flex-direction:column;gap:8px;min-width:0}
.deg{display:flex;align-items:center;gap:6px;font:400 14px/1 var(--ar)}
.deg input{width:84px}
.dir-quick{display:flex;gap:4px}
.dir-quick button{all:unset;cursor:pointer;font:400 11px/1 var(--ar);padding:6px 7px;border:1px solid var(--line);color:var(--mut)}
.dir-quick button:hover{border-color:rgba(0,0,0,.45);color:var(--ink)}
.dir-quick button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.shuf{display:grid;grid-template-columns:1fr 1fr;gap:6px}.shuf .btn{justify-content:center}
.favs{display:flex;flex-wrap:wrap;gap:6px}
.mix{display:flex;flex-direction:column;gap:2px}
.mrow{display:grid;grid-template-columns:14px 72px minmax(0,1fr) 40px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mrow i{width:14px;height:14px;border-radius:50%;display:block;outline:1px solid var(--line)}
.mrow span{font:400 13px/1 var(--ar)}
.mrow output{font:500 12px/1 var(--ar);text-align:right;font-variant-numeric:tabular-nums}
.mrow input{width:100%;accent-color:#000}
.fav{display:inline-flex;align-items:center;border:1px solid var(--line)}
.fav button{all:unset;cursor:pointer;padding:6px 8px;font:400 12px/1 var(--ar)}
.fav i{display:block;width:34px;height:20px}
/* stage */
.stage{display:flex;flex-direction:column;gap:14px;padding-block:28px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0}
.stage-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:500 11px/1 var(--ar);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.frame{flex:1;display:grid;place-items:center;min-height:0;background:#DADADA;padding:28px}
#view{display:block;max-width:100%;box-shadow:0 20px 50px rgba(0,0,0,.14)}
.status{min-height:18px;font:400 13px/1.4 var(--ar);color:var(--mut)}
#gl{position:absolute;left:-99999px;top:0;width:8px;height:8px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{max-height:none;border-right:0;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));order:2}
  .stage{order:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .frame{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

        <button type="button" id="m1" data-mode="1" aria-pressed="false">Abstract Field</button>
        <button type="button" id="m2" data-mode="2" aria-pressed="false">Velvet Gradient</button>
        <button type="button" id="m3" data-mode="3" aria-pressed="false">Atmospheric Grain</button>
        <button type="button" id="m4" data-mode="4" aria-pressed="false">Atmospheric Motion</button>

      <div class="swatches" id="sw" role="group" aria-label="Colours"></div>

      <div class="dirrow">
        <div class="dial" id="dial" role="slider" tabindex="0" aria-label="Gradient direction" aria-valuemin="0" aria-valuemax="359" aria-valuenow="125" aria-valuetext="125 degrees"><span class="needle" id="needle"></span></div>
        <div class="dir-r">
          <label class="f" for="angle">Direction</label>
          <div class="deg"><input type="number" id="angle" min="0" max="359" step="1" value="125" inputmode="numeric"><span aria-hidden="true">°</span></div>
          <div class="dir-quick" role="group" aria-label="Direction presets"><button type="button" data-ang="0">0°</button><button type="button" data-ang="90">90°</button><button type="button" data-ang="180">180°</button><button type="button" data-ang="270">270°</button></div>
        </div>
      </div>
      <div class="seg" style="--n:2" role="group" aria-label="Motion">
        <button type="button" id="still" aria-pressed="true">Still</button>
        <button type="button" id="motion" aria-pressed="false">Motion</button>
      </div>
      <div class="shuf" role="group" aria-label="Shuffle">
        <button class="btn" type="button" id="shColours">Shuffle colours</button>
        <button class="btn" type="button" id="shuffle">Shuffle shape</button>
        <button class="btn" type="button" id="shStyle">Shuffle style</button>
        <button class="btn" type="button" id="shAll">Shuffle everything</button>

      <div class="favs" id="favs"></div>

    </div>

const glc = $('#gl');
const gl = glc.getContext('webgl', { preserveDrawingBuffer:true, antialias:false });
const FS = `precision highp float;
uniform vec2 uR; uniform float uT,uSeed,uMode,uN,uGrain,uBlur,uWhite,uAng,uWOn; uniform vec3 uC[6]; uniform float uWt[6]; uniform vec3 uW;
float h(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float h1(float x){return fract(sin(x*91.37)*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),u.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<4;i++){v+=a*n(p);p=m*p;a*=.5;}return v/.94;}
// palette laid out by each colour's share: a bigger share owns a wider band
vec3 pal(float x){x=clamp(x,0.,1.);vec3 c=uC[0];float acc=uWt[0];float pc=uWt[0]*.5;
  for(int i=1;i<6;i++){if(float(i)<uN){float ci=acc+uWt[i]*.5;float bw=ci-pc;
    c=mix(c,uC[i],smoothstep(pc+bw*.2,ci-bw*.2,x));pc=ci;acc+=uWt[i];}}return c;}
float blobE(float fi0,float wt,vec2 p,vec2 dir,vec2 per){
  float fi=fi0+uSeed*.13;
  vec2 c=dir*(.15+.55*h1(fi+1.))+per*((h1(fi+2.)-.5)*1.3)+.12*vec2(sin(uT*1.3+fi),cos(uT*1.1+fi*1.7));
  float r=(.32+.18*h1(fi+3.))*uBlur*clamp(sqrt(wt*uN),.45,1.9); vec2 d=p-c; return -dot(d,d)/(r*r);}

  float gm=(uMode>2.5&&uMode<3.5)?2.6:((uMode>1.5&&uMode<2.5)?1.7:1.);

let U = {};
if (gl) {

const hex = x => [1,3,5].map(i => parseInt(x.slice(i, i + 2), 16) / 255);

function renderGL(w, h, t, st) {
  glc.width = w; glc.height = h; gl.viewport(0, 0, w, h);
  const cols = (st.cols.length ? st.cols : ['deploy']).map(k => hex(COLORS.find(c => c.k === k).hex));
  const flat = new Float32Array(18); cols.forEach((c, i) => flat.set(c, i * 3));
  const keys = st.cols.length ? st.cols : ['deploy'];
  const raw = keys.map(k => Math.max(1, (st.wts && st.wts[k]) || 50)); const tot = raw.reduce((a, b) => a + b, 0);

/* ---------------- Composition (artwork + brand layer) ---------------- */
let IMG = {};
function compose(ctx, w, h, t) {
  ctx.clearRect(0, 0, w, h);
  if (gl) ctx.drawImage(renderGL(w, h, t, S), 0, 0, w, h);
  const ink = S.ink === 'white' ? '#F2F2F2' : '#000000';
  const mark = S.ink === 'white' ? IMG.markW : IMG.markB, lk = S.ink === 'white' ? IMG.lkW : IMG.lkB;
  const short = Math.min(w, h), m = Math.round(short * .065);
  if (S.centre !== 'none') {
    if (S.centre === 'mark') { const s = short * S.lsize; ctx.drawImage(mark, (w - s) / 2, (h - s) / 2, s, s); }
    else { const lw = Math.min(w * .8, short * S.lsize * 3.2), lh = lw * lk.height / lk.width; ctx.drawImage(lk, (w - lw) / 2, (h - lh) / 2, lw, lh); }
  }
  if (S.hdr || S.ftr) {
    const fs = Math.max(10, Math.round(short * .022)), lh = Math.round(short * .045);
    ctx.fillStyle = ink; ctx.font = `400 ${fs}px "PP Telegraf", Arial, sans-serif`; ctx.textBaseline = 'middle';
    const logo = (y) => {   // logo on the left
      if (S.hfl === 'mark') ctx.drawImage(mark, m, y - lh / 2, lh, lh);
      else { const lw = lh * 1.6 * lk.width / lk.height * .62, hh = lw * lk.height / lk.width; ctx.drawImage(lk, m, y - hh / 2, lw, hh); }
    };
    const yt = m + lh / 2, yb = h - m - lh / 2;
    ctx.textAlign = 'right';   // text on the right
    if (S.hdr) { logo(yt); ctx.fillText(S.hl, w - m, yt); }
    if (S.ftr) { ctx.fillText(S.fl, w - m, yb); ctx.textAlign = 'left'; ctx.fillText('www.kai.krd', m, yb); }
  }
  if (S.hon && S.htxt.trim()) {
    const words = S.htxt.toUpperCase(); let fs = Math.round(short * .12);
    ctx.font = `400 ${fs}px "PP Telegraf", Arial, sans-serif`;
    const maxW = w - m * 2; while (ctx.measureText(words).width > maxW && fs > 12) { fs -= 2; ctx.font = `400 ${fs}px "PP Telegraf", Arial, sans-serif`; }
    ctx.fillStyle = ink; ctx.textBaseline = 'alphabetic';
    if ('letterSpacing' in ctx) ctx.letterSpacing = `${-fs * .03}px`;
    if (S.hpos === 'c') { ctx.textAlign = 'center'; ctx.fillText(words, w / 2, h / 2 + fs * .35); }
    else { ctx.textAlign = 'left'; ctx.fillText(words, m, h - m - (S.ftr ? short * .09 : 0)); }

}

/* ---------------- Preview loop ---------------- */
const view = $('#view'), vctx = view.getContext('2d');
let t = 0, last = performance.now(), dirty = true;
const fmt = () => FORMATS.find(f => f.id === S.fmt);
// Fit the preview inside the stage at the format's exact ratio, so nothing is ever stretched.
function sizeView() {
  const f = fmt(), r = f.w / f.h, fr = document.querySelector('.frame'), cs = getComputedStyle(fr);
  const availW = Math.max(120, fr.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
  const availH = Math.max(120, matchMedia('(max-width:900px)').matches ? innerHeight * .7 : innerHeight - 140);
  let cw = availW, ch = cw / r; if (ch > availH) { ch = availH; cw = ch * r; }
  view.style.width = Math.round(cw) + 'px'; view.style.height = Math.round(cw / r) + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2), long = Math.min(1800, Math.round(Math.max(cw, ch) * dpr));
  view.width = r >= 1 ? long : Math.max(1, Math.round(long * r)); view.height = r >= 1 ? Math.max(1, Math.round(long / r)) : long;
  $('#dims').textContent = `${f.name} · ${f.mm ? f.mm[0] + '×' + f.mm[1] + ' mm' : f.w + '×' + f.h + ' px'}`;
  dirty = true;
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(now) {
  const dt = (now - last) / 1000; last = now;
  const moving = S.motion && !reduce;
  if (moving) { t += dt * .06; dirty = true; }
  if (dirty) { compose(vctx, view.width, view.height, t); dirty = false; }
  requestAnimationFrame(loop);
}

/* ---------------- Controls ---------------- */
function press(sel, on) { document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', String(on(b)))); }
let mixKey = '';
function drawMix() {
  const box = $('#mix'); const key = S.cols.join(',');
  const shares = () => { const tot = S.cols.reduce((a, k) => a + S.wts[k], 0); return Object.fromEntries(S.cols.map(k => [k, Math.round(S.wts[k] / tot * 100)])); };
  if (key !== mixKey) {
    mixKey = key; box.textContent = '';
    const row = (id, dot, name, val, min, onIn) => {
      const r = document.createElement('div'); r.className = 'mrow';
      const i = document.createElement('i'); i.style.background = dot;
      const sp = document.createElement('label'); sp.htmlFor = id; sp.textContent = name; sp.style.font = '400 13px/1 var(--ar)';
      const inp = document.createElement('input'); inp.type = 'range'; inp.id = id; inp.min = min; inp.max = 100; inp.step = 1; inp.value = val;
      const o = document.createElement('output'); o.htmlFor = id; o.id = id + '-o';
      inp.oninput = () => { onIn(+inp.value); updateMix(); dirty = true; };
      r.append(i, sp, inp, o); box.append(r);
    };
    row('w-white', '#F6F1EF', 'White space', S.white, 10, v => { S.white = v; });
    S.cols.forEach(k => { const c = COLORS.find(x => x.k === k); row('w-' + k, c.hex, c.name, S.wts[k], 5, v => { S.wts[k] = v; }); });
  }
  updateMix();
  function updateMix() { const sh = shares(); $('#w-white').value = S.white; $('#w-white-o').textContent = S.white + '%';
    $('#w-white').disabled = !S.whiteOn; $('#w-white').closest('.mrow').classList.toggle('off', !S.whiteOn);
    S.cols.forEach(k => { const el = $('#w-' + k); if (el) { el.value = S.wts[k]; $('#w-' + k + '-o').textContent = sh[k] + '%'; } }); }
}
function syncUI() {
  press('[data-mode]', b => +b.dataset.mode === S.mode);
  document.querySelectorAll('.sw[data-k]').forEach(b => { const i = S.cols.indexOf(b.dataset.k); b.setAttribute('aria-pressed', String(i > -1)); b.dataset.order = i > -1 ? i + 1 : ''; });
  press('#still', () => !S.motion); press('#motion', () => S.motion);
  press('#hpC', () => S.hpos === 'c'); press('#hpB', () => S.hpos === 'bl');
  press('#inkB', () => S.ink === 'black'); press('#inkW', () => S.ink === 'white');
  $('#label').textContent = STYLES[S.mode];
  ['grain', 'blur'].forEach(k => $('#' + k).value = S[k]);
  $('#c-white').setAttribute('aria-pressed', String(S.whiteOn));
  syncAngle();
  dirty = true;
}
function syncAngle() {
  $('#needle').style.transform = `rotate(${S.angle}deg)`;
  const d = $('#dial'); d.setAttribute('aria-valuenow', S.angle); d.setAttribute('aria-valuetext', `${S.angle} degrees`);
  if (document.activeElement !== $('#angle')) $('#angle').value = S.angle;
}
function setAngle(v) { if (!Number.isFinite(v)) return; S.angle = ((Math.round(v) % 360) + 360) % 360; syncAngle(); dirty = true; }

function build() {
  const sw = $('#sw');
  const wb = document.createElement('button'); wb.type = 'button'; wb.id = 'c-white'; wb.className = 'sw white'; wb.title = 'White #F6F1EF'; wb.setAttribute('aria-label', 'White');
  wb.onclick = () => { S.whiteOn = !S.whiteOn; syncUI(); }; sw.append(wb);
  const dial = $('#dial');
  const fromPointer = e => { const r = dial.getBoundingClientRect(); const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    let a = Math.atan2(dx, -dy) * 180 / Math.PI; if (e.shiftKey) a = Math.round(a / 15) * 15; setAngle(a); };
  dial.addEventListener('pointerdown', e => { dial.setPointerCapture(e.pointerId); fromPointer(e); });
  dial.addEventListener('pointermove', e => { if (dial.hasPointerCapture(e.pointerId)) fromPointer(e); });
  dial.addEventListener('keydown', e => {
    const step = e.shiftKey ? 15 : 1, k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowUp') setAngle(S.angle + step);
    else if (k === 'ArrowLeft' || k === 'ArrowDown') setAngle(S.angle - step);
    else if (k === 'PageUp') setAngle(S.angle + 15); else if (k === 'PageDown') setAngle(S.angle - 15);
    else if (k === 'Home') setAngle(0); else if (k === 'End') setAngle(359); else return;
    e.preventDefault(); });
  $('#angle').oninput = e => { if (e.target.value !== '') setAngle(+e.target.value); };
  $('#angle').onchange = () => syncAngle();
  $('#angle').onblur = () => syncAngle();
  document.querySelectorAll('[data-ang]').forEach(b => b.onclick = () => setAngle(+b.dataset.ang));
  COLORS.forEach(c => { const b = document.createElement('button'); b.type = 'button'; b.id = 'c-' + c.k; b.className = 'sw'; b.dataset.k = c.k; b.style.background = c.hex; b.title = `${c.name} ${c.hex}`; b.setAttribute('aria-label', `${c.name} ${c.hex}`);
    b.onclick = () => { const i = S.cols.indexOf(c.k); if (i > -1) { if (S.cols.length > 1) S.cols.splice(i, 1); } else if (S.cols.length < 6) S.cols.push(c.k); syncUI(); }; sw.append(b); });
  const sel = $('#fmt'); FORMATS.forEach(f => { const o = document.createElement('option'); o.value = f.id; o.textContent = f.name; sel.append(o); });
  sel.value = S.fmt; sel.onchange = () => { S.fmt = sel.value; sizeView(); };
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.mode = +b.dataset.mode; syncUI(); });
  $('#still').onclick = () => { S.motion = false; syncUI(); }; $('#motion').onclick = () => { S.motion = true; syncUI(); };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const newSeed = () => { S.seed = Math.round(Math.random() * 4000) / 100; };
  const newCols = () => { const pool = COLORS.map(c => c.k).sort(() => Math.random() - .5); S.cols = pool.slice(0, 2 + Math.floor(Math.random() * 3)); };
  const newMode = () => { let m; do { m = Math.floor(Math.random() * STYLES.length); } while (m === S.mode); S.mode = m; };
  $('#shuffle').onclick = () => { newSeed(); syncUI(); };
  $('#shColours').onclick = () => { newCols(); syncUI(); };
  $('#shStyle').onclick = () => { newMode(); syncUI(); };
  $('#shAll').onclick = () => { newMode(); newCols(); newSeed(); S.angle = Math.floor(Math.random() * 360); S.grain = Math.round(rnd(.03, .1) * 1000) / 1000; S.blur = Math.round(rnd(.75, 1.5) * 100) / 100; syncUI(); };
  ['grain', 'blur'].forEach(k => $('#' + k).oninput = e => { S[k] = +e.target.value; dirty = true; });
  $('#centre').onchange = e => { S.centre = e.target.value; dirty = true; };
  $('#lsize').oninput = e => { S.lsize = +e.target.value; dirty = true; };
  $('#hdr').onchange = e => { S.hdr = e.target.checked; dirty = true; };
  $('#ftr').onchange = e => { S.ftr = e.target.checked; dirty = true; };
  $('#hon').onchange = e => { S.hon = e.target.checked; dirty = true; };
  $('#hfl').onchange = e => { S.hfl = e.target.value; dirty = true; };
  ['hl', 'fl', 'htxt'].forEach(k => $('#' + k).oninput = e => { S[k] = e.target.value; dirty = true; });
  $('#hpC').onclick = () => { S.hpos = 'c'; syncUI(); }; $('#hpB').onclick = () => { S.hpos = 'bl'; syncUI(); };
  $('#inkB').onclick = () => { S.ink = 'black'; syncUI(); }; $('#inkW').onclick = () => { S.ink = 'white'; syncUI(); };
  $('#saveFav').onclick = () => { favs.unshift({ mode:S.mode, cols:[...S.cols], wts:{ ...S.wts }, white:S.white, whiteOn:S.whiteOn, angle:S.angle, seed:S.seed, grain:S.grain, blur:S.blur }); favs = favs.slice(0, 12); storeFavs(); drawFavs(); say('Saved to favourites in this browser.'); };
  $('#png').onclick = () => exportArt('png'); $('#pdf').onclick = () => exportArt('pdf');
}

/* ---------------- Favourites (this browser only) ---------------- */
let favs = []; try { favs = JSON.parse(localStorage.getItem('kai-grad-favs-v2') || '[]'); } catch (e) { favs = []; }
function storeFavs() { try { localStorage.setItem('kai-grad-favs-v2', JSON.stringify(favs)); } catch (e) {} }
function drawFavs() {
  const box = $('#favs'); box.textContent = '';
  favs.forEach((f, i) => { const d = document.createElement('span'); d.className = 'fav';
    const a = document.createElement('button'); a.type = 'button'; a.setAttribute('aria-label', `Load favourite ${i + 1}`);
    const sw = document.createElement('i'); sw.style.background = `linear-gradient(90deg,${(f.whiteOn === false ? [] : ['#F6F1EF']).concat(f.cols.map(k => COLORS.find(c => c.k === k).hex)).join(',')})`; a.append(sw);
    a.onclick = () => { Object.assign(S, { whiteOn:true, angle:125 }, f, { cols:[...f.cols], wts:{ ...S.wts }, white: 45, mode: f.mode < STYLES.length ? f.mode : 0 }); syncUI(); };
    const x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label', `Remove favourite ${i + 1}`);
    x.onclick = () => { favs.splice(i, 1); storeFavs(); drawFavs(); };
    d.append(a, x); box.append(d); });
}

/* ---------------- Export ---------------- */
const say = m => { $('#status').textContent = m; };
let dl = null; (async () => { try { dl = await window.claude?.use?.('downloads'); } catch (e) { dl = null; } })();
async function deliver(name, blob) {
  if (dl) {
    try { await dl.save({ filename:name, data:blob }); say(`Saved ${name}.`); }
    catch (e) { say(e && e.code === 'declined' ? 'Save cancelled.' : 'This view cannot save files. Open the page in claude.ai to download.'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); say(`Downloaded ${name}.`);
}
async function exportArt(kind) {
  const f = fmt(); const btn = $('#' + kind); btn.disabled = true; say('Rendering full size…');
  try {
    await document.fonts.ready;
    let w = f.w, h = f.h; const cap = MAXGL || 4096; const k = Math.min(1, cap / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h; compose(c.getContext('2d'), w, h, t);
    const base = `KAI-${SLUG(STYLES[S.mode])}-${f.id}`;
    if (kind === 'png') {
      const blob = await new Promise(r => c.toBlob(r, 'image/png')); await deliver(base + '.png', blob);
    } else {
      if (!window.jspdf) { say('The PDF library did not load. Check your connection and try again.'); return; }
      const unit = f.mm ? 'mm' : 'px', pw = f.mm ? f.mm[0] : f.w, ph = f.mm ? f.mm[1] : f.h;
      const doc = new window.jspdf.jsPDF({ orientation: pw >= ph ? 'landscape' : 'portrait', unit, format:[pw, ph], hotfixes:['px_scaling'], compress:true });
      doc.addImage(c.toDataURL('image/jpeg', .95), 'JPEG', 0, 0, pw, ph);
      await deliver(base + '.pdf', doc.output('blob'));
    }
  } catch (e) { console.error(e); say('Export failed. Try a smaller size.'); }
  finally { btn.disabled = false; dirty = true; }
}

/* ---------------- Boot ---------------- */
(async () => {
  const [mB, mW, lB, lW] = await Promise.all([A.markB, A.markW, A.lkB, A.lkW].map(loadImg));
  IMG = { markB:mB, markW:mW, lkB:lB, lkW:lW };
  build(); drawFavs(); syncUI(); sizeView();
  let rz = 0; const refit = () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(sizeView); };
  addEventListener('resize', refit); new ResizeObserver(refit).observe(document.querySelector('.frame'));
  if (!gl) say('WebGL is off in this browser, so the gradient cannot be generated here.');
  document.fonts.ready.then(() => { dirty = true; });
  requestAnimationFrame(loop);
})();
})();
